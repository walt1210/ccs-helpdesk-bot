<!DOCTYPE html> <!-- Tells the browser this is a modern HTML5 page -->
<html lang="en"> <!-- Start of the page; the language is English -->
<head> <!-- The head holds settings, the title and the styles (nothing visible) -->
  <meta charset="UTF-8"> <!-- Use UTF-8 so all letters and symbols show correctly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Makes the page fit phone screens -->
  <title>CCS Help Desk Bot · AUF</title> <!-- Text shown on the browser tab -->

  <style> /* Everything inside <style> controls how the page LOOKS */

    :root { /* :root holds our color "variables" so we can reuse them everywhere */
      --red: #b31b1b; /* AUF red, used for the header and student bubbles */
      --red-dark: #8c1414; /* A darker red for hover effects */
      --gold: #e0a526; /* AUF gold, used for accents and buttons */
      --gold-light: #fdf3dc; /* A very light gold, used for the bot bubbles */
      --page: #f6f4f1; /* The soft background color of the whole page */
      --text: #222222; /* Main text color (almost black) */
      --muted: #6b6b6b; /* Grey text for small notes */
    } /* End of the color variables */

    * { box-sizing: border-box; } /* Padding and borders are counted inside each box's width (easier layouts) */

    body { /* Styles for the whole page body */
      margin: 0; /* Remove the browser's default outer space */
      font-family: "Segoe UI", Arial, sans-serif; /* Clean, readable font */
      background: var(--page); /* Use our soft page color */
      color: var(--text); /* Use our main text color */
      display: flex; /* Arrange header, panel, chat and input in a column... */
      flex-direction: column; /* ...from top to bottom */
      height: 100vh; /* Make the page exactly as tall as the screen */
    } /* End of body styles */

    header { /* The red top bar */
      background: var(--red); /* Red background */
      color: #ffffff; /* White text */
      padding: 14px 20px; /* Space inside the bar (top/bottom, left/right) */
      border-bottom: 5px solid var(--gold); /* Gold stripe under the header */
    } /* End of header styles */

    header h1 { /* The big title inside the header */
      margin: 0; /* Remove default space around the title */
      font-size: 1.4rem; /* Title size */
    } /* End of title styles */

    header p { /* The small line under the title */
      margin: 4px 0 0; /* A little space above it only */
      font-size: 0.9rem; /* Smaller text */
      color: var(--gold); /* Gold text */
    } /* End of subtitle styles */

    /* ---------- NEW: Bot Instructions panel ---------- */
    #panel { /* The fold-open box that holds the six instruction boxes */
      max-width: 800px; /* Same width as the chat area */
      width: calc(100% - 40px); /* Full width minus a 20px gap on each side */
      margin: 12px auto 0; /* Space above it; centered on the page */
      background: #ffffff; /* White card */
      border: 2px solid var(--gold); /* Gold border */
      border-radius: 12px; /* Rounded corners */
      max-height: 55vh; /* Never taller than about half the screen... */
      overflow-y: auto; /* ...scroll inside it if the boxes don't fit */
      flex-shrink: 0; /* Don't let the chat squash the panel's title bar */
    } /* End of panel styles */

    #panel summary { /* The clickable title bar of the panel */
      padding: 10px 14px; /* Space inside the title bar */
      font-weight: bold; /* Bold text */
      color: var(--red); /* Red text */
      cursor: pointer; /* Hand pointer: it can be clicked to open/close */
    } /* End of summary styles */

    .fields { /* The grid that holds the six labeled boxes */
      display: grid; /* Use a grid layout */
      grid-template-columns: 1fr 1fr; /* Two columns on wide screens */
      gap: 10px 14px; /* Space between rows and columns */
      padding: 0 14px 14px; /* Space inside the panel around the grid */
    } /* End of grid styles */

    @media (max-width: 600px) { /* On phones (narrow screens)... */
      .fields { grid-template-columns: 1fr; } /* ...use just one column */
    } /* End of phone rule */

    .field label { /* The name above each box (Role, Task, ...) */
      display: block; /* Put the label on its own line */
      font-size: 0.8rem; /* Small text */
      font-weight: bold; /* Bold */
      color: var(--red-dark); /* Dark red */
      margin-bottom: 4px; /* Small gap between label and box */
      text-transform: uppercase; /* Show it in capital letters */
      letter-spacing: 0.05em; /* Spread the letters a little */
    } /* End of label styles */

    .field textarea { /* Each of the six instruction boxes */
      width: 100%; /* Fill its grid cell */
      min-height: 64px; /* Tall enough for two or three lines */
      padding: 8px; /* Space inside the box */
      font: inherit; /* Use the same font as the page */
      font-size: 0.9rem; /* Slightly smaller text */
      border: 1px solid #dddddd; /* Light grey border */
      border-radius: 8px; /* Rounded corners */
      resize: vertical; /* The user may drag it taller, but not wider */
    } /* End of textarea styles */

    .field textarea:focus { /* When a box is clicked into */
      outline: none; /* Remove the browser's blue outline */
      border-color: var(--gold); /* Show a gold border instead */
    } /* End of textarea focus styles */

    .panel-actions { /* The row with the Save and Reset buttons */
      display: flex; /* Put the items side by side */
      align-items: center; /* Line them up vertically */
      gap: 10px; /* Space between them */
      padding: 0 14px 14px; /* Space inside the panel */
    } /* End of action-row styles */

    .panel-actions button { /* Shared look for Save and Reset */
      padding: 8px 16px; /* Space inside the button */
      font-weight: bold; /* Bold text */
      border-radius: 8px; /* Rounded corners */
      cursor: pointer; /* Hand pointer */
    } /* End of shared button styles */

    #saveBtn { /* The Save instructions button */
      background: var(--red); /* Red button */
      color: #ffffff; /* White text */
      border: none; /* No border */
    } /* End of Save button styles */

    #saveBtn:hover { background: var(--red-dark); } /* Darker red when the mouse is over it */

    #resetBtn { /* The Reset to default button */
      background: #ffffff; /* White button */
      color: var(--red); /* Red text */
      border: 1px solid var(--red); /* Red outline */
    } /* End of Reset button styles */

    #saveStatus { /* Small message like "Saved!" next to the buttons */
      font-size: 0.8rem; /* Small text */
      color: var(--muted); /* Grey */
    } /* End of status styles */
    /* ---------- End of new panel styles ---------- */

    #chat { /* The scrolling area that holds all the message bubbles */
      flex: 1; /* Take up all the leftover height */
      overflow-y: auto; /* Show a scrollbar when there are many messages */
      padding: 20px; /* Space around the messages */
      display: flex; /* Stack the bubbles... */
      flex-direction: column; /* ...one under the other */
      gap: 10px; /* Space between bubbles */
      max-width: 800px; /* Don't let the chat get too wide on big screens */
      width: 100%; /* Use full width up to the max */
      margin: 0 auto; /* Center the chat area on the page */
    } /* End of chat area styles */

    .bubble { /* Shared look for every message bubble */
      max-width: 75%; /* A bubble never takes the full width */
      padding: 10px 14px; /* Space inside the bubble */
      border-radius: 14px; /* Rounded corners */
      line-height: 1.45; /* Comfortable spacing between lines */
      white-space: pre-wrap; /* Keep line breaks that the bot writes */
      word-wrap: break-word; /* Break very long words so they don't overflow */
    } /* End of shared bubble styles */

    .user { /* Student bubble */
      align-self: flex-end; /* Push it to the RIGHT side */
      background: var(--red); /* Red background */
      color: #ffffff; /* White text */
      border-bottom-right-radius: 4px; /* Chat "tail" on the right */
    } /* End of student bubble styles */

    .bot { /* Bot bubble */
      align-self: flex-start; /* Push it to the LEFT side */
      background: var(--gold-light); /* Light gold background */
      border: 1px solid var(--gold); /* Thin gold border */
      border-bottom-left-radius: 4px; /* Chat "tail" on the left */
    } /* End of bot bubble styles */

    .thinking { /* The temporary "Thinking..." bubble */
      font-style: italic; /* Slanted text */
      color: var(--muted); /* Grey text */
    } /* End of thinking styles */

    .error { /* Bubble used when something goes wrong */
      align-self: center; /* Put it in the middle */
      background: #fff0f0; /* Very light red background */
      border: 1px solid var(--red); /* Red border */
      color: var(--red-dark); /* Dark red text */
      font-size: 0.9rem; /* Slightly smaller text */
    } /* End of error styles */

    form { /* The bottom bar with the text box and Send button */
      display: flex; /* Put the box and button side by side */
      gap: 10px; /* Space between them */
      padding: 14px 20px; /* Space inside the bar */
      background: #ffffff; /* White background */
      border-top: 3px solid var(--gold); /* Gold line on top */
    } /* End of form styles */

    #input { /* The text box */
      flex: 1; /* Stretch to take all the free width */
      padding: 12px; /* Space inside the box */
      font-size: 1rem; /* Normal text size */
      border: 2px solid #dddddd; /* Light grey border */
      border-radius: 10px; /* Rounded corners */
    } /* End of text box styles */

    #input:focus { /* When the student clicks into the box */
      outline: none; /* Remove the browser's default blue outline */
      border-color: var(--gold); /* Show a gold border instead */
    } /* End of focus styles */

    #send { /* The Send button */
      padding: 0 22px; /* Space on the left and right of the word */
      font-size: 1rem; /* Normal text size */
      font-weight: bold; /* Bold text */
      background: var(--gold); /* Gold button */
      color: #3a2a00; /* Dark brown text for good contrast on gold */
      border: none; /* No border */
      border-radius: 10px; /* Rounded corners */
      cursor: pointer; /* Show the "hand" pointer on hover */
    } /* End of button styles */

    #send:hover { background: #c98f17; } /* Slightly darker gold when the mouse is over it */

    #send:disabled { /* While we are waiting for the bot */
      opacity: 0.5; /* Make the button look faded */
      cursor: not-allowed; /* Show a "no" pointer */
    } /* End of disabled styles */

    #usage { /* The small token counter under the input */
      text-align: center; /* Center the text */
      font-size: 0.75rem; /* Tiny text */
      color: var(--muted); /* Grey */
      padding: 0 0 8px; /* A little space at the bottom */
      background: #ffffff; /* Same white as the form bar */
    } /* End of usage styles */

  </style> <!-- End of the styles -->
</head> <!-- End of the head -->

<body> <!-- Everything inside body is what the student SEES -->

  <header> <!-- The red title bar -->
    <h1>CCS Help Desk Bot</h1> <!-- App name -->
    <p>Angeles University Foundation · College of Computer Studies</p> <!-- School name in gold -->
  </header> <!-- End of the title bar -->

  <!-- NEW: Bot Instructions panel. <details> folds open and closed when its title is clicked -->
  <details id="panel"> <!-- Starts closed so the chat has room; click the title to open -->
    <summary>⚙ Bot Instructions</summary> <!-- The clickable title bar -->
    <div class="fields"> <!-- The grid of six labeled boxes -->
      <div class="field"><label for="f-role">Role</label><textarea id="f-role" maxlength="600"></textarea></div> <!-- Who the bot is -->
      <div class="field"><label for="f-task">Task</label><textarea id="f-task" maxlength="600"></textarea></div> <!-- What the bot does -->
      <div class="field"><label for="f-rules">Rules</label><textarea id="f-rules" maxlength="600"></textarea></div> <!-- Limits the bot must follow -->
      <div class="field"><label for="f-format">Format</label><textarea id="f-format" maxlength="600"></textarea></div> <!-- How answers should look -->
      <div class="field"><label for="f-example">Example</label><textarea id="f-example" maxlength="600"></textarea></div> <!-- A sample question and answer -->
      <div class="field"><label for="f-fallback">Fallback</label><textarea id="f-fallback" maxlength="600"></textarea></div> <!-- What to do when unsure -->
    </div> <!-- End of the grid -->
    <div class="panel-actions"> <!-- The row of buttons under the boxes -->
      <button id="saveBtn" type="button">Save instructions</button> <!-- Applies and remembers the edits -->
      <button id="resetBtn" type="button">Reset to default</button> <!-- Puts the original text back -->
      <span id="saveStatus"></span> <!-- Shows "Saved!" or "Unsaved changes" -->
    </div> <!-- End of the button row -->
  </details> <!-- End of the panel -->

  <main id="chat"></main> <!-- Empty area; JavaScript will add the message bubbles here -->

  <form id="form"> <!-- The bottom bar; "form" lets the Enter key send too -->
    <input id="input" type="text" maxlength="300" placeholder="Ask about classes, labs, requirements..." autocomplete="off"> <!-- Text box, max 300 characters -->
    <button id="send" type="submit">Send</button> <!-- The Send button -->
  </form> <!-- End of the bottom bar -->

  <div id="usage">Tokens used: 0 in · 0 out</div> <!-- Small counter of tokens used so far -->

  <script> // Everything inside <script> is JavaScript that makes the page WORK

    // ---------- 1) Default bot instructions (the six boxes start with these) ----------
    const DEFAULTS = { // An object: each key is one box, each value is its starting text
      role: "You are the CCS Help Desk assistant for AUF students.", // Role box
      task: "Answer questions about classes, labs and school requirements.", // Task box
      rules: "School topics only. 3 sentences or fewer. Simple English; Taglish is OK.", // Rules box
      format: "Plain, friendly sentences.", // Format box
      example: "Q: Where can I print? A: At the CCS help desk.", // Example box
      fallback: "If you are not sure, say \"I'm not sure. Please ask the CCS office.\" Never guess." // Fallback box (\" = a quote mark inside the text)
    }; // End of defaults

    const FIELD_NAMES = ["role", "task", "rules", "format", "example", "fallback"]; // The six boxes, in the order they join
    const STORAGE_KEY = "ccsBotInstructions"; // The name we save under in this browser's storage

    const MAX_CHARS = 300; // The longest message a student may send (same as the server's limit)
    const MAX_HISTORY = 20; // How many recent messages we send to the server (keeps requests small)

    // ---------- 2) Grab the parts of the page we will use ----------
    const chat = document.getElementById("chat"); // The chat area
    const form = document.getElementById("form"); // The bottom form
    const input = document.getElementById("input"); // The text box
    const sendBtn = document.getElementById("send"); // The Send button
    const usageBox = document.getElementById("usage"); // The token counter
    const saveBtn = document.getElementById("saveBtn"); // NEW: Save instructions button
    const resetBtn = document.getElementById("resetBtn"); // NEW: Reset to default button
    const saveStatus = document.getElementById("saveStatus"); // NEW: the small status message

    function box(name) { // Helper: find the textarea for one field name
      return document.getElementById("f-" + name); // e.g. "role" → the element with id "f-role"
    } // End of box helper

    // ---------- 3) Load the saved instructions (or the defaults) ----------
    let instructions = Object.assign({}, DEFAULTS); // Start with a copy of the defaults
    try { // Browser storage can fail (private mode), so we "try"
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); // Read what was saved before (or null)
      if (saved) Object.assign(instructions, saved); // If something was saved, use it over the defaults
    } catch (e) { /* If storage is blocked, just keep the defaults */ } // End of load

    function fillBoxes() { // Put the current instructions into the six boxes
      FIELD_NAMES.forEach(function (name) { // Go through each field name
        box(name).value = instructions[name] || ""; // Show its text in its box
      }); // End of loop
    } // End of fillBoxes
    fillBoxes(); // Fill the boxes now, when the page opens

    // ---------- 4) Combine the six boxes into ONE system prompt ----------
    function buildSystemPrompt() { // Returns the full job card as one piece of text
      return FIELD_NAMES // Start from the list of field names
        .filter(function (name) { return instructions[name].trim() !== ""; }) // Skip boxes left empty
        .map(function (name) { return name.toUpperCase() + ": " + instructions[name].trim(); }) // e.g. "ROLE: You are..."
        .join("\n"); // Put each section on its own line
    } // End of buildSystemPrompt

    // ---------- 5) Save and Reset buttons ----------
    saveBtn.addEventListener("click", function () { // When "Save instructions" is clicked
      FIELD_NAMES.forEach(function (name) { // Go through each box
        instructions[name] = box(name).value; // Copy its current text into our instructions
      }); // End of loop
      try { // Try to remember the edits in this browser
        localStorage.setItem(STORAGE_KEY, JSON.stringify(instructions)); // Save them as JSON text
        saveStatus.textContent = "Saved! The bot will use these from the next message."; // Confirm success
      } catch (e) { // If the browser blocks storage...
        saveStatus.textContent = "Applied for this visit (this browser can't save them)."; // ...they still work until the page closes
      } // End of try/catch
    }); // End of Save handler

    resetBtn.addEventListener("click", function () { // When "Reset to default" is clicked
      instructions = Object.assign({}, DEFAULTS); // Go back to a copy of the defaults
      fillBoxes(); // Show the defaults in the boxes
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore storage errors */ } // Forget the saved edits
      saveStatus.textContent = "Back to the default instructions."; // Confirm the reset
    }); // End of Reset handler

    FIELD_NAMES.forEach(function (name) { // Watch every box for typing
      box(name).addEventListener("input", function () { // Whenever the text in a box changes...
        saveStatus.textContent = "Unsaved changes. Click Save instructions."; // ...remind the user to save
      }); // End of input handler
    }); // End of loop

    // ---------- 6) The conversation memory ----------
    const messages = []; // A list of { role, content } objects; starts empty
    let totalIn = 0; // Running total of input tokens
    let totalOut = 0; // Running total of output tokens

    // ---------- 7) Helper: add a bubble to the chat ----------
    function addBubble(text, kind) { // "text" = what to show, "kind" = "user", "bot", "thinking" or "error"
      const div = document.createElement("div"); // Make a new empty <div>
      div.className = "bubble " + (kind === "thinking" ? "bot thinking" : kind); // Give it the right CSS classes
      div.textContent = text; // Put the text inside (textContent is safe: it never runs HTML)
      chat.appendChild(div); // Add the bubble to the bottom of the chat
      chat.scrollTop = chat.scrollHeight; // Scroll down so the newest bubble is visible
      return div; // Give the bubble back, so we can remove it later (for "Thinking...")
    } // End of addBubble

    // ---------- 8) Welcome message when the page opens ----------
    addBubble("Hi! I'm the CCS Help Desk Bot. How can I help you today?", "bot"); // First friendly bubble

    // ---------- 9) What happens when the student presses Send ----------
    form.addEventListener("submit", async function (event) { // Run this function when the form is submitted
      event.preventDefault(); // Stop the browser from reloading the page (its default behavior)

      const text = input.value.trim(); // Read the text box and remove extra spaces at both ends
      if (text === "") return; // If the box is empty, do nothing
      if (text.length > MAX_CHARS) { // If the message is too long...
        addBubble("Please keep your message under " + MAX_CHARS + " characters.", "error"); // ...show a warning
        return; // ...and stop here
      } // End of length check

      addBubble(text, "user"); // Show the student's message on the right
      messages.push({ role: "user", content: text }); // Save it in the conversation memory
      input.value = ""; // Clear the text box
      sendBtn.disabled = true; // Disable Send so the student can't double-send
      input.disabled = true; // Lock the text box while waiting

      const thinking = addBubble("Thinking...", "thinking"); // Show the temporary "Thinking..." bubble

      try { // "try" = attempt the risky part (the network call); errors jump to "catch"
        const response = await fetch("/api/chat", { // Send a request to OUR server function (never to Google directly)
          method: "POST", // POST = we are sending data
          headers: { "Content-Type": "application/json" }, // Tell the server we are sending JSON
          body: JSON.stringify({ // Turn our object into JSON text
            system: buildSystemPrompt(), // CHANGED: the six saved boxes combined into one job card
            messages: messages.slice(-MAX_HISTORY) // Only the most recent messages
          }) // End of the JSON body
        }); // End of fetch

        const data = await response.json().catch(function () { return {}; }); // Read the server's JSON (empty object if it's not JSON)
        thinking.remove(); // Remove the "Thinking..." bubble

        if (!response.ok) { // If the server said something went wrong (status 400, 429, 500...)
          const msg = data.error || "Something went wrong. Please try again."; // Use the server's message, or a default one
          addBubble("Oops! " + msg, "error"); // Show a friendly error bubble
          messages.pop(); // Remove the unanswered question from memory so the chat stays tidy
          return; // Stop here (the "finally" part below still runs)
        } // End of error check

        const reply = data.reply || "Sorry, I didn't get an answer. Please try again."; // The bot's answer (or a fallback)
        addBubble(reply, "bot"); // Show the answer on the left
        messages.push({ role: "assistant", content: reply }); // Save the answer in memory

        if (data.usage) { // If the server sent token counts...
          totalIn += data.usage.input || 0; // ...add the input tokens to the total
          totalOut += data.usage.output || 0; // ...add the output tokens to the total
          usageBox.textContent = "Tokens used: " + totalIn + " in · " + totalOut + " out"; // Update the counter
        } // End of usage update

      } catch (err) { // This runs if the request could not be sent at all (no internet, server down...)
        thinking.remove(); // Remove the "Thinking..." bubble
        addBubble("Oops! I couldn't reach the server. Check your internet and try again.", "error"); // Friendly error
        messages.pop(); // Remove the unanswered question from memory
      } finally { // "finally" always runs, success or failure
        sendBtn.disabled = false; // Turn the Send button back on
        input.disabled = false; // Unlock the text box
        input.focus(); // Put the cursor back in the text box, ready for the next question
      } // End of try/catch/finally
    }); // End of the submit handler

  </script> <!-- End of the JavaScript -->
</body> <!-- End of the visible page -->
</html> <!-- End of the HTML document -->
